<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Learner — Language Student Desk</title>
<link rel="stylesheet" href="../languages/learners.css">
<link rel="stylesheet" href="../languages/klingon/piqad.css">
<style>
  .layout { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 1.2rem; align-items: start; }
  .layout > * { min-width: 0; }
  .lesson-pane { min-width: 0; max-width: 100%; }
  .lessons { position: sticky; top: 1rem; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0.5rem; }
  .lessons button { display: flex; width: 100%; max-width: 100%; min-width: 0; text-align: left; gap: 0.5rem; align-items: center; background: none; border: 1px solid transparent; margin-bottom: 2px; padding: 0.5rem 0.6rem; min-height: 44px; }
  .level-tabs { display: flex; flex: 0 0 auto; flex-wrap: nowrap; align-items: stretch; gap: 0.4rem; width: 100%; max-width: 100%; min-width: 0; min-height: 44px; overflow-x: auto; overflow-y: hidden; margin: 0 0 0.45rem; padding: 0 0 0.15rem; -webkit-overflow-scrolling: touch; touch-action: pan-x; scrollbar-width: thin; }
  .level-tabs button { flex: 0 0 auto; min-height: 44px; white-space: nowrap; border-radius: 999px; padding: 0.35rem 0.9rem; border: 1px solid #5c5c6a; background: #22222a; color: var(--muted); font-size: 0.92rem; line-height: 1.2; }
  .level-tabs button.active { background: var(--accent); border-color: var(--gold); color: #fff; font-weight: 700; box-shadow: 0 0 0 2px var(--gold); }
  .with-levels .lesson-pane { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0.5rem 0.5rem 0.35rem; display: flex; flex-direction: column; min-height: 0; max-height: calc(100dvh - 8.5rem); overflow: hidden; position: sticky; top: 1rem; }
  .with-levels .lessons { background: none; border: none; border-radius: 0; padding: 0; position: static; box-shadow: none; flex: 1 1 auto; min-height: 0; max-width: 100%; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .back-lessons { display: none; }
  .level-kicker { margin: 0 0 0.35rem; color: var(--gold); font-size: 0.8rem; letter-spacing: 0.02em; }
  .lessons button:hover { background: #22222a; border-color: transparent; }
  .lessons button.active { background: var(--accent); }
  .lessons .tick { width: 1.2rem; flex-shrink: 0; color: var(--correct); }
  .lessons .lt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .lessons .score { font-size: 0.75rem; color: var(--muted); }
  .lessons hr { border: none; border-top: 1px solid var(--line); margin: 0.4rem 0; }
  .lesson h2 { margin-bottom: 0.2rem; }
  .lesson .sum { color: var(--muted); margin-top: 0; }
  .lesson h3 { color: #c5cae9; margin: 1.2rem 0 0.3rem; font-size: 1.05rem; }
  .ex { border-left: 3px solid var(--accent2); background: #17171d; padding: 0.5rem 0.8rem; margin: 0.5rem 0; border-radius: 0 6px 6px 0; }
  .ex .t { font-size: 1.3rem; font-family: var(--cjk); }
  .ex .t mark, .drill-q mark { background: none; color: var(--gold); font-weight: 700; }
  .ex .pq { font-family: "pIqaD", sans-serif; color: var(--gold); font-size: 1.3rem; }
  .ex .r { color: #90caf9; font-size: 0.9rem; }
  .ex .e { color: var(--text); font-size: 0.95rem; }
  .gridtable { overflow-x: auto; margin: 0.8rem 0; }
  .gridtable table { min-width: 560px; }
  .gridtable td, .gridtable th { text-align: center; font-family: ui-monospace, Consolas, monospace; }
  .gridtable th { font-family: inherit; }
  .gridtable td.no { color: #444; }
  .gridtable td { vertical-align: middle; }
  .gridtable td.empty { color: var(--gold); font-style: italic; }
  .lesson p mark { background: none; color: var(--gold); font-weight: 700; }
  .gridtable tr:hover td { background: #1e1e26; }
  .practice { border-top: 2px solid var(--accent); }
  .drill-q { font-size: 1.35rem; font-family: var(--cjk); margin: 0.3rem 0; }
  .drill-q .pq { display: block; font-family: "pIqaD", sans-serif; color: var(--gold); }
  .drill-en { color: var(--muted); margin-bottom: 0.8rem; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.5rem; }
  .opts button { font-family: var(--cjk); font-size: 1.05rem; padding: 0.7rem; text-align: left; }
  .opts button.right { border-color: var(--correct); background: #1d2e1f; }
  .opts button.wrongpick { border-color: var(--wrong); background: #321c1c; }
  .why { margin-top: 0.8rem; padding: 0.6rem 0.8rem; border-radius: 6px; background: #17171d; }
  .why.ok { border-left: 3px solid var(--correct); }
  .why.bad { border-left: 3px solid var(--wrong); }
  .scorebar { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.5rem; }
  header.top {
    flex-direction: column;
    align-items: stretch;
    gap: 0.65rem;
  }
  header.top .grow { flex: none; width: 100%; min-width: 0; }
  header.top h1 { line-height: 1.25; overflow-wrap: normal; word-break: normal; }
  header.top .head-tools { width: 100%; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  header.top .lang-pick { display: block; flex: 1 1 100%; min-width: 0; }
  header.top .lang-pick select { width: 100%; max-width: 100%; min-height: 44px; margin-top: 0.25rem; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .lessons { position: static; }
    header.top { max-width: 100%; }
    header.top select { max-width: 100%; }
    body.levels-phone { width: 100%; max-width: 100%; height: 100dvh; max-height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
    body.levels-phone header.top { flex: 0 0 auto; min-width: 0; max-width: 100%; }
    body.levels-phone main,
    body.levels-phone #course.with-levels,
    body.levels-phone .lesson-pane,
    body.levels-phone .level-tabs,
    body.levels-phone .lessons { min-width: 0; max-width: 100%; }
    body.levels-phone main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0.35rem; }
    body.levels-phone footer.foot { flex: 0 0 auto; padding: 0.35rem 0.6rem; }
    body.levels-phone #course.with-levels { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; gap: 0.4rem; }
    body.levels-phone #course.with-levels:not(.show-lesson) #lesson { display: none; }
    body.levels-phone #course.with-levels.show-lesson .lesson-pane { display: none; }
    body.levels-phone #course.with-levels.show-lesson #lesson { flex: 1 1 auto; min-height: 0; overflow: auto; }
    body.levels-phone #course.with-levels:not(.show-lesson) .lesson-pane { flex: 1 1 auto; max-height: none; position: static; min-height: 0; }
    body.levels-phone #course.show-lesson .back-lessons { display: inline-flex; align-items: center; min-height: 44px; margin: 0 0 0.6rem; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="grow">
    <h1 id="title">Grammar Learner</h1>
    <p id="subtitle">Short lessons with examples, then a drill that explains every answer.</p>
  </div>
  <div class="head-tools">
    <label class="small muted" id="piqadOpt" hidden><input type="checkbox" id="piqad"> Show pIqaD</label>
    <label class="small muted lang-pick">Language <select id="langSelect"></select></label>
  </div>
</header>
<main>
  <section id="home" hidden>
    <h2>Pick a language</h2>
    <div class="grid" id="langGrid"></div>
  </section>
  <section id="course" class="layout" hidden>
    <div class="lesson-pane" id="lessonPane">
      <div class="level-tabs" id="levelTabs" role="tablist" aria-label="Lesson levels" hidden></div>
      <nav class="lessons" id="lessonList"></nav>
    </div>
    <div id="lesson"></div>
  </section>
</main>
<footer class="foot">Part of Language Student Desk · lessons written for the Desk. Practise the words in the <a id="vocabLink" href="../vocabulary-learner/index.html">Vocabulary Learner</a>.</footer>

<script src="../languages/registry.js"></script>
<script src="../languages/lsd-lang.js"></script>
<script src="../languages/lsd-levels.js"></script>
<script src="app.js"></script>
</body>
</html>
