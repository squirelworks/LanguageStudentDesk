name: SquirrelGo Kanji APK

# Compile only: proves the app still builds on every PR and push to main,
# but uploads nothing. For a test APK, run "SquirrelGo test APK" by hand;
# release APKs come from the release workflow.
on:
  push:
    branches: [main]
    paths:
      - "SquirrelGo-Apps/squirrelgo-characters/squirrelgo-kanji/**"
      - ".github/workflows/squirrelgo-kanji-apk.yml"
  pull_request:
    paths:
      - "SquirrelGo-Apps/squirrelgo-characters/squirrelgo-kanji/**"
      - ".github/workflows/squirrelgo-kanji-apk.yml"

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SquirrelGo-Apps/squirrelgo-characters/squirrelgo-kanji
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK; just make sure API 36 is there.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" > /dev/null
      - name: Sync web assets into the APK
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -a www android/app/src/main/assets/www
      - name: Build debug APK
        working-directory: SquirrelGo-Apps/squirrelgo-characters/squirrelgo-kanji/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
