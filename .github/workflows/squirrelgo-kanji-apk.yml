name: SquirrelGo Kanji APK

on:
  push:
    paths:
      - "SquirrelGo-Apps/squirrelgo-characters/squirrelgo-kanji/**"
      - ".github/workflows/squirrelgo-kanji-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

# Two runs replacing the same release at once would race; let the newest win.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SquirrelGo-Apps/squirrelgo-characters/squirrelgo-kanji
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK; just make sure API 34 is there.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Sync web assets into the APK
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -a www android/app/src/main/assets/www
      - name: Build debug APK
        working-directory: SquirrelGo-Apps/squirrelgo-characters/squirrelgo-kanji/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SquirrelGoKanji-debug-apk
          path: SquirrelGo-Apps/squirrelgo-characters/squirrelgo-kanji/android/app/build/outputs/apk/debug/app-debug.apk
      # A rolling pre-release per app, so the APK can be downloaded straight to a phone.
      # Only builds from main are published; other branches just keep the run artifact.
      - name: Publish pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=squirrelgo-kanji-latest
          cp android/app/build/outputs/apk/debug/app-debug.apk SquirrelGoKanji-debug.apk
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" SquirrelGoKanji-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "SquirrelGo Kanji (latest build)" \
            --notes "Jōyō kanji trainer with stroke order. Debug build, sideload on Android 7.0+. Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
