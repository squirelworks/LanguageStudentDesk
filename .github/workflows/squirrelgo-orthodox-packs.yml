name: SquirrelGo Orthodox Bible text packs

# Builds the downloadable Bibles (sources.PACKS in tools/texts) from
# scrollmapper and eBible.org, force-pushes them as a single commit to the
# data-only branch "orthodox-bible-texts" (served to the app from
# raw.githubusercontent.com), and commits packs.json, catalog.js and
# versification.js back to the branch that ran it. Run it from the Actions
# tab, or push a change to this file or to tools/texts/sources.py.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/squirrelgo-orthodox-packs.yml"
      - "SquirrelGo-Apps/squirrelgo-orthodox-bible/tools/texts/sources.py"

permissions:
  contents: write

concurrency:
  group: squirrelgo-orthodox-packs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SquirrelGo-Apps/squirrelgo-orthodox-bible/tools/texts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download sources
        env:
          SGO_SKIP_COMMENTARY: "1"
        run: |
          ./fetch_sources.sh
          ./fetch_sources.sh ebible
      - name: Build packs, verse check and catalog
        run: |
          python3 build_bibles.py --packs
          python3 build_versification.py --check
          python3 build_catalog.py
      - name: Publish packs to the orthodox-bible-texts branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd packs
          cat > README.md <<'MD'
          # SquirrelGo Orthodox Bible text packs

          Generated by the "SquirrelGo Orthodox Bible text packs" workflow from
          SquirrelGo-Apps/squirrelgo-orthodox-bible/tools/texts on the main branch.
          Each bibles/<id>.js is a public-domain or openly licensed Bible; its
          license and source are in the file's first lines and in tools/texts/README.md.
          This branch is force-pushed on every build; do not commit to it.
          MD
          git init -q -b orthodox-bible-texts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Bible text packs built from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:orthodox-bible-texts
      - name: Commit the pack list and catalog to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd "$GITHUB_WORKSPACE"
          T=SquirrelGo-Apps/squirrelgo-orthodox-bible
          git add $T/tools/texts/packs.json $T/www/data/catalog.js $T/www/data/versification.js
          git commit -m "Build Bible text packs for SquirrelGo Orthodox Bible" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
