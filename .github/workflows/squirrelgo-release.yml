      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Build the native Kanji APK
        run: |
          cd native
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :android:kanji:assembleRelease
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/kanji/build/outputs/apk/release/*.apk "$RUNNER_TEMP/apk/SquirrelGoKanji.apk"
          VN=$(grep -m1 '^versionName=' versions/kanji.properties | cut -d= -f2-)
          IFS=. read -r MAJOR MINOR PATCH <<< "$VN"
          VC=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "| SquirrelGoKanji | com.squirelworks.squirrelgokanji | $VN | $VC |" > "$RUNNER_TEMP/apk/SquirrelGoKanji.row"
          echo "SquirrelGo Kanji $VN" > "$RUNNER_TEMP/apk/SquirrelGoKanji.label"
      - name: Attach the APK to the draft
        run: |
          gh release upload "$VERSION" "$RUNNER_TEMP/apk/SquirrelGoKanji.apk#$(cat "$RUNNER_TEMP/apk/SquirrelGoKanji.label")" \
            --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: row-kanji
          path: ${{ runner.temp }}/apk/SquirrelGoKanji.row
          retention-days: 1
          if-no-files-found: error

  # Native Klingon. The file name stays SquirrelGoKlingon.apk. It is signed with
  # the committed debug key, so APK_KEYSTORE_BASE64 cannot change the
  # signature. The Play bundle is a different workflow.
  native-klingon:
    needs: [check, draft, deps]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Build the native Klingon APK
        run: |
          cd native
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :android:klingon:assembleRelease
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/klingon/build/outputs/apk/release/*.apk "$RUNNER_TEMP/apk/SquirrelGoKlingon.apk"
          VN=$(grep -m1 '^versionName=' versions/klingon.properties | cut -d= -f2-)
          IFS=. read -r MAJOR MINOR PATCH <<< "$VN"
          VC=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "| SquirrelGoKlingon | com.squirelworks.squirrelgoklingon | $VN | $VC |" > "$RUNNER_TEMP/apk/SquirrelGoKlingon.row"
          echo "SquirrelGo Klingon $VN" > "$RUNNER_TEMP/apk/SquirrelGoKlingon.label"
      - name: Attach the APK to the draft
        run: |
          gh release upload "$VERSION" "$RUNNER_TEMP/apk/SquirrelGoKlingon.apk#$(cat "$RUNNER_TEMP/apk/SquirrelGoKlingon.label")" \
            --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: row-klingon
          path: ${{ runner.temp }}/apk/SquirrelGoKlingon.row
          retention-days: 1
          if-no-files-found: error

  # The Linux, Windows and macOS Desk builds, each attached to the draft as
  # soon as it's built. Publishing doesn't build them again.
  desktop:
    needs: [check, draft]
    permissions:
      contents: write
    uses: ./.github/workflows/desk-desktop-builds.yml
    with:
      tag: ${{ inputs.version }}
      ref: ${{ needs.check.outputs.sha }}
      rewrite_checksums: false

  # Once everything on the draft is attached: the version table, and
  # SHA256SUMS.txt over every file on the draft. Assets added after publish
  # are covered when those workflows rewrite the sums.
  finish:
    needs: [check, draft, apk, native-kana, native-bopomofo, native-alphabets, native-kanji, native-klingon, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ needs.check.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: row-*
          path: rows
          merge-multiple: true
      - name: Download the draft's files
        run: |
          gh release download "$VERSION" --dir dist --repo "$GITHUB_REPOSITORY"
          rm -f dist/SHA256SUMS.txt
          ls -l dist
      - name: Nothing that belongs elsewhere
        run: |
          BAD=""
          for F in dist/*; do
            case "${F#dist/}" in *.aab|orthodox-bible-*|orthodox-commentary-*) BAD="$BAD ${F#dist/}" ;; esac
          done
          if [ -n "$BAD" ]; then
            echo "::error::these never go on a platform release: $BAD"; exit 1
          fi
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Notes
        env:
          HAS_KEY: ${{ secrets.APK_KEYSTORE_BASE64 != '' }}
        run: |
          DATA=$(git ls-tree HEAD data | awk '{print $3}')
          {
            if [ -f "release-notes/$VERSION.md" ]; then
              cat "release-notes/$VERSION.md"
            else
              echo "Notes for $VERSION haven't been written yet."
            fi
            echo
            echo "## App versions"
            echo
            echo "| App | Package | versionName | versionCode |"
            echo "| --- | --- | --- | --- |"
            LC_ALL=C sort rows/*.row
            echo
            echo "Built from \`$SHA\`, with squirrel-lang-data at \`${DATA:-none}\`."
            echo
            if [ "$HAS_KEY" = true ]; then
              echo "APKs are signed with the SquirrelGo APK signing key."
            else
              echo "APKs are signed with each app's fixed debug key, so they install over earlier builds."
            fi
          } > notes.md
      - name: Finish the draft
        run: |
          gh release upload "$VERSION" dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}" -F draft=true -F body=@notes.md > /dev/null
          gh release view "$VERSION" --json url,isDraft -q '"\(.url) draft=\(.isDraft)"' --repo "$GITHUB_REPOSITORY"
