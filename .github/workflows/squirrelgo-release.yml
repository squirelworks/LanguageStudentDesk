  # uploaded here. The learner pages stay in the repo; this job only builds
  # the native APK.
  native-electronics:
    needs: [check, draft, deps]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Build the native Electronics Student Desk APK
        run: |
          cd native
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :android:electronics:assembleRelease
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/electronics/build/outputs/apk/release/*.apk "$RUNNER_TEMP/apk/ElectronicsStudentDesk.apk"
          VN=$(grep -m1 '^versionName=' versions/electronics.properties | cut -d= -f2-)
          IFS=. read -r MAJOR MINOR PATCH <<< "$VN"
          VC=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "| ElectronicsStudentDesk | com.squirelworks.electronicsstudentdesk | $VN | $VC |" > "$RUNNER_TEMP/apk/ElectronicsStudentDesk.row"
