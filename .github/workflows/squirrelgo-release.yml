name: SquirrelGo release (draft)

# Started by hand after the release PR merges (docs/RELEASE_PLAN.md).
# Makes, or refreshes, a DRAFT GitHub Release right away, then each release
# APK and each Linux, Windows and macOS Desk build is attached to it as soon
# as its own job finishes, and SHA256SUMS.txt is written over the draft at
# the end. After publish, the native desktop and Desk desktop workflows
# attach the files they still owe and rewrite SHA256SUMS.txt over every
# asset. An AAB is never included. Rerunning reuses the same draft. It never
# publishes and never creates, moves or deletes a tag: the owner clicks
# Publish, which creates the tag and starts the Play workflow.
# No AAB and no Orthodox Bible pack is ever attached here.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Platform version, e.g. squirrelgo-v0.1.0"
        required: true
      ref:
        description: "Branch or commit to release (default: main)"
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: squirrelgo-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: The version is new
        run: |
          echo "$VERSION" | grep -Eq '^(squirrelgo-)?v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "version must look like squirrelgo-v1.2.3"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists; tags are never reused or moved"; exit 1
          fi
          if gh release view "$VERSION" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "release $VERSION is already published"; exit 1
          fi

  # The draft exists from the start, so the release page fills in while
  # the builds run. One draft per version: an existing one is reused.
  draft:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.make.outputs.id }}
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ needs.check.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: Notes
        env:
          HAS_KEY: ${{ secrets.APK_KEYSTORE_BASE64 != '' }}
        run: |
          DATA=$(git ls-tree HEAD data | awk '{print $3}')
          {
            if [ -f "release-notes/$VERSION.md" ]; then
              cat "release-notes/$VERSION.md"
            else
              echo "Notes for $VERSION haven't been written yet."
            fi
            echo
            echo "Built from \`$SHA\`, with squirrel-lang-data at \`${DATA:-none}\`."
            echo
            if [ "$HAS_KEY" = true ]; then
              echo "APKs are signed with the SquirrelGo APK signing key."
            else
              echo "APKs are signed with each app's fixed debug key, so they install over earlier builds."
            fi
          } > notes.md
      - name: Make or refresh the draft release
        id: make
        run: |
          TITLE="SquirrelGo $VERSION"
          R="$GITHUB_REPOSITORY"
          # Drafts have no tag yet, so look them up in the list of releases.
          IDS=$(gh api --paginate "repos/$R/releases?per_page=100" --jq '.[] | select(.tag_name == env.VERSION) | .id')
          N=$(printf '%s\n' "$IDS" | grep -c . || true)
          if [ "$N" -gt 1 ]; then
            echo "::error::$N releases exist for $VERSION; delete the extra drafts, then rerun"; exit 1
          elif [ "$N" -eq 1 ]; then
            gh api -X PATCH "repos/$R/releases/$IDS" -F draft=true -f target_commitish="$SHA" \
              -f name="$TITLE" -F body=@notes.md > /dev/null
            # The old checksums would be wrong until the last job rewrites them.
            for A in $(gh api "repos/$R/releases/$IDS/assets?per_page=100" --jq '.[] | select(.name == "SHA256SUMS.txt") | .id'); do
              gh api -X DELETE "repos/$R/releases/assets/$A"
            done
            echo "reusing the existing draft for $VERSION"
          else
            IDS=$(gh api -X POST "repos/$R/releases" -f tag_name="$VERSION" -f target_commitish="$SHA" \
              -f name="$TITLE" -F body=@notes.md -F draft=true --jq .id)
          fi
          echo "id=$IDS" >> "$GITHUB_OUTPUT"
          gh release view "$VERSION" --json url,isDraft -q '"\(.url) draft=\(.isDraft)"'

  # Fills the shared Gradle cache once, so the app builds below read it
  # instead of all downloading the same tooling from Maven Central at once.
  deps:
    needs: check
    uses: ./.github/workflows/gradle-deps-cache.yml
    with:
      ref: ${{ needs.check.outputs.sha }}

  apk:
    needs: [check, draft, deps]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { app: dictionary,       dir: SquirrelGo-Apps/squirrelgo-dictionary,                      name: SquirrelGoJapaneseDictionary }
          - { app: orthodox-bible,   dir: SquirrelGo-Apps/squirrelgo-orthodox-bible,                  name: SquirrelGoOrthodoxBible }
          - { app: phrasebook,       dir: SquirrelGo-Apps/squirrelgo-phrasebook,                      name: SquirrelGoPhrasebook }
          - { app: lsd-suite,        dir: SquirrelGo-Apps/lsd-suite,                                  name: LanguageStudentDesk }
          - { app: programming-desk, dir: SquirrelGo-Apps/programming-student-desk,                   name: ProgrammingStudentDesk }
          - { app: math-desk,         dir: SquirrelGo-Apps/math-student-desk,                          name: MathsEduTrainingHelper }
          - { app: electronics-desk,  dir: SquirrelGo-Apps/electronics-student-desk,                   name: ElectronicsStudentDesk }
    env:
      VERSION: ${{ inputs.version }}
      DIR: ${{ matrix.dir }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The cache key covers only what decides the downloads: the Gradle
      # wrapper, plugin and library versions and repositories in the Gradle
      # files, minus versionCode/versionName, so a release's version bump
      # keeps the cache. This step is the same in every workflow that uses it.
      - name: Gradle cache key
        id: gradle-key
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          FP=$(git ls-files ':(glob)SquirrelGo-Apps/**/gradle-wrapper.properties' ':(glob)SquirrelGo-Apps/**/android/*.gradle' ':(glob)SquirrelGo-Apps/**/android/app/build.gradle' ':(glob)SquirrelGo-Apps/tools/*.gradle' \
            | LC_ALL=C sort | while read -r F; do echo "== $F"; grep -vE '^[[:space:]]*version(Code|Name)([[:space:]=(]|$)' "$F" || true; done \
            | sha256sum | cut -c1-40)
          echo "key=gradle-deps-v2-$RUNNER_OS-$FP" | tee -a "$GITHUB_OUTPUT"
      # Gradle and the Android build tools come from one shared cache, filled
      # once by the "Gradle deps cache" workflow; builds only read it.
      - name: Restore Gradle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-key.outputs.key }}
          restore-keys: |
            gradle-deps-v2-${{ runner.os }}-
            gradle-deps-v1-${{ runner.os }}-
      # The same preparation as each app's compile-only workflow.
      - name: Check audio coverage
        if: matrix.app == 'phrasebook'
        run: cd "$DIR" && python3 tools/phrasebook_audio.py --check
      - name: Download dictionary data
        if: matrix.app == 'dictionary'
        run: cd "$DIR" && tools/fetch_data.sh
      - name: Sync web assets into the APK
        if: matrix.app == 'phrasebook'
        run: |
          rm -rf "$DIR/android/app/src/main/assets/www"
          mkdir -p "$DIR/android/app/src/main/assets"
          cp -a "$DIR/www" "$DIR/android/app/src/main/assets/www"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" > /dev/null
      # With an APK signing key in secrets the APK is release-signed; without
      # it, each app's build.gradle falls back to its fixed debug key. This is
      # not the Play upload key, which stays out of this repo's CI (RELEASES.md).
      - name: APK signing key
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.APK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PW: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/apk.keystore"
            {
              echo "UPLOAD_STORE_FILE=$RUNNER_TEMP/apk.keystore"
              echo "UPLOAD_STORE_PASSWORD=$STORE_PW"
              echo "UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "UPLOAD_KEY_PASSWORD=$KEY_PW"
            } >> "$GITHUB_ENV"
            echo "signing with the APK signing key"
          else
            echo "no APK signing key in secrets; signing with the app's debug key"
            # Programming Student Desk doesn't commit its debug key; all apps share one.
            K="$DIR/android/app/debug.keystore"
            [ -f "$K" ] || cp SquirrelGo-Apps/lsd-suite/android/app/debug.keystore "$K"
          fi
      - name: Build release APK
        run: |
          cd "$DIR/android"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/${{ matrix.name }}.apk"
          VN=$(grep -m1 -E '^\s*versionName' app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          VC=$(grep -m1 -E '^\s*versionCode' app/build.gradle | grep -oE '[0-9]+')
          PKG=$(grep -m1 -E '^\s*applicationId' app/build.gradle | sed -E "s/.*['\"](.*)['\"].*/\1/")
          echo "| ${{ matrix.name }} | $PKG | $VN | $VC |" > "$RUNNER_TEMP/apk/${{ matrix.name }}.row"
          # The release shows each APK as its app's name and version
          # ("SquirrelGo Kana 1.1.10"); the file name stays the same so
          # releases/latest/download/<name>.apk links keep working.
          APP=$(grep -m1 -oE '<string name="app_name">[^<]+' app/src/main/res/values/strings.xml | sed 's/.*>//')
          [ -n "$APP" ] || { echo "no app_name in strings.xml"; exit 1; }
          echo "$APP $VN" > "$RUNNER_TEMP/apk/${{ matrix.name }}.label"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/apk.keystore"
      # On the draft as soon as this app is built.
      - name: Attach the APK to the draft
        run: |
          gh release upload "$VERSION" "$RUNNER_TEMP/apk/${{ matrix.name }}.apk#$(cat "$RUNNER_TEMP/apk/${{ matrix.name }}.label")" \
            --clobber --repo "$GITHUB_REPOSITORY"
      # The app's row for the version table in the notes; kept for one day.
      - uses: actions/upload-artifact@v4
        with:
          name: row-${{ matrix.app }}
          path: ${{ runner.temp }}/apk/${{ matrix.name }}.row
          retention-days: 1
          if-no-files-found: error

  # Native Alphabets. The file name stays SquirrelGoAlphabets.apk. It is signed
  # with the committed debug key, so APK_KEYSTORE_BASE64 cannot change the
  # signature. The Play bundle is a different workflow.
  native-alphabets:
    needs: [check, draft, deps]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Build the native Alphabets APK
        run: |
          cd native
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :android:alphabets:assembleRelease
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/alphabets/build/outputs/apk/release/*.apk "$RUNNER_TEMP/apk/SquirrelGoAlphabets.apk"
          VN=$(grep -m1 '^versionName=' versions/alphabets.properties | cut -d= -f2-)
          IFS=. read -r MAJOR MINOR PATCH <<< "$VN"
          VC=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "| SquirrelGoAlphabets | com.squirelworks.squirrelgoalphabets | $VN | $VC |" > "$RUNNER_TEMP/apk/SquirrelGoAlphabets.row"
          echo "SquirrelGo Alphabets $VN" > "$RUNNER_TEMP/apk/SquirrelGoAlphabets.label"
      - name: Attach the APK to the draft
        run: |
          gh release upload "$VERSION" "$RUNNER_TEMP/apk/SquirrelGoAlphabets.apk#$(cat "$RUNNER_TEMP/apk/SquirrelGoAlphabets.label")" \
            --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: row-alphabets
          path: ${{ runner.temp }}/apk/SquirrelGoAlphabets.row
          retention-days: 1
          if-no-files-found: error

  # Native Bopomofo. Signed with the committed debug key, the same key as the
  # published WebView build, so the release file installs over it.
  native-bopomofo:
    needs: [check, draft, deps]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Build the native Bopomofo APK
        run: |
          cd native
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :android:bopomofo:assembleRelease
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/bopomofo/build/outputs/apk/release/*.apk "$RUNNER_TEMP/apk/SquirrelGoBopomofo.apk"
          VN=$(grep -m1 '^versionName=' versions/bopomofo.properties | cut -d= -f2-)
          IFS=. read -r MAJOR MINOR PATCH <<< "$VN"
          VC=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "| SquirrelGoBopomofo | com.squirelworks.squirrelgobopomofo | $VN | $VC |" > "$RUNNER_TEMP/apk/SquirrelGoBopomofo.row"
          echo "SquirrelGo Bopomofo $VN" > "$RUNNER_TEMP/apk/SquirrelGoBopomofo.label"
      - name: Attach the APK to the draft
        run: |
          gh release upload "$VERSION" "$RUNNER_TEMP/apk/SquirrelGoBopomofo.apk#$(cat "$RUNNER_TEMP/apk/SquirrelGoBopomofo.label")" \
            --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: row-bopomofo
          path: ${{ runner.temp }}/apk/SquirrelGoBopomofo.row
          retention-days: 1
          if-no-files-found: error

  # Native Kana. The file name stays SquirrelGoKana.apk. It is signed with the
  # committed debug key, the same key native-desktop uses, so APK_KEYSTORE_BASE64
  # cannot change the signature. The Play bundle is a different workflow.
  native-kana:
    needs: [check, draft, deps]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Build the native Kana APK
        run: |
          cd native
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :android:kana:assembleRelease
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/kana/build/outputs/apk/release/*.apk "$RUNNER_TEMP/apk/SquirrelGoKana.apk"
          VN=$(grep -m1 '^versionName=' versions/kana.properties | cut -d= -f2-)
          IFS=. read -r MAJOR MINOR PATCH <<< "$VN"
          VC=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "| SquirrelGoKana | com.squirelworks.squirrelgokana | $VN | $VC |" > "$RUNNER_TEMP/apk/SquirrelGoKana.row"
          echo "SquirrelGo Kana $VN" > "$RUNNER_TEMP/apk/SquirrelGoKana.label"
      - name: Attach the APK to the draft
        run: |
          gh release upload "$VERSION" "$RUNNER_TEMP/apk/SquirrelGoKana.apk#$(cat "$RUNNER_TEMP/apk/SquirrelGoKana.label")" \
            --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: row-kana
          path: ${{ runner.temp }}/apk/SquirrelGoKana.row
          retention-days: 1
          if-no-files-found: error

  # Native Kanji. The file name stays SquirrelGoKanji.apk. It is signed with
  # the committed debug key, so APK_KEYSTORE_BASE64 cannot change the
  # signature. The Play bundle is a different workflow.
  native-kanji:
    needs: [check, draft, deps]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
