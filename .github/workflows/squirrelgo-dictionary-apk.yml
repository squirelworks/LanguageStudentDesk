name: SquirrelGo Dictionary APK

on:
  push:
    paths:
      - "squirrelgo-dictionary/**"
      - ".github/workflows/squirrelgo-dictionary-apk.yml"
  workflow_dispatch:
    inputs:
      data_tag:
        description: "jmdict-simplified release tag (blank = latest)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: squirrelgo-dictionary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download dictionary data (JMdict, KANJIDIC2, RADKFILE, KRADFILE)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/fetch_data.sh ${{ inputs.data_tag }}
      # The runner image ships the Android SDK; just make sure API 34 is there.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Sync web assets into the APK
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -a www android/app/src/main/assets/www
      - name: Build APK
        working-directory: squirrelgo-dictionary/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../SquirrelGoDictionary.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SquirrelGoDictionary-apk
          path: squirrelgo-dictionary/SquirrelGoDictionary.apk
      # A rolling pre-release, so the APK can be downloaded straight to a phone.
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=squirrelgo-dictionary-latest
          DATE=$(grep -o '"jmdictDate":"[^"]*"' www/data/meta.js | cut -d'"' -f4)
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" SquirrelGoDictionary.apk --prerelease --target "$GITHUB_SHA" \
            --title "SquirrelGo Dictionary (latest build)" \
            --notes "Offline Japanese–English dictionary. Data: JMdict $DATE. Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
