name: Desk data checks

# Registry generation, JS syntax, and programming pack integrity for the Desk
# languages/ layer and learner tools, plus an informational languages coverage
# report. See CURSOR-HANDOFF P0.1 / P0.2.

on:
  push:
    branches: [main]
    paths:
      - "languages/**"
      - "character-learner/**"
      - "grammar-learner/**"
      - "vocabulary-learner/**"
      - "reference-learner/**"
      - "resource-learner/**"
      - "translation-learner/**"
      - "language-learner/**"
      - "programming-learner/**"
      - "data"
      - ".gitmodules"
      - ".github/workflows/desk-data-check.yml"
  pull_request:
    paths:
      - "languages/**"
      - "character-learner/**"
      - "grammar-learner/**"
      - "vocabulary-learner/**"
      - "reference-learner/**"
      - "resource-learner/**"
      - "translation-learner/**"
      - "language-learner/**"
      - "programming-learner/**"
      - "data"
      - ".gitmodules"
      - ".github/workflows/desk-data-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Data submodule is a commit on squirrel-lang-data main
        run: |
          pinned=$(git -C data rev-parse HEAD)
          git -C data fetch -q --depth=1000 origin main
          git -C data merge-base --is-ancestor "$pinned" FETCH_HEAD \
            || { echo "data/ is pinned to $pinned, which is not on squirrel-lang-data main"; exit 1; }
      - name: Registry is committed and complete
        run: |
          python3 languages/build_registry.py
          # Also catches a language added in data/ whose meta.json isn't committed.
          changed=$(git status --porcelain languages)
          if [ -n "$changed" ]; then
            echo "Generated files are stale; run python3 languages/build_registry.py and commit:"
            echo "$changed"
            exit 1
          fi
      - name: Desk and learner scripts parse
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find languages -name '*.js' -print0 | sort -z)
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find \
            character-learner \
            grammar-learner \
            vocabulary-learner \
            reference-learner \
            resource-learner \
            translation-learner \
            language-learner \
            programming-learner \
            -name '*.js' -print0 | sort -z)
      - name: Programming packs check out
        run: python3 programming-learner/tools/check_packs.py
      - name: Translation Learner matrix and language-pair tests
        run: node translation-learner/check.js
      - name: Numerical methods track matches known results
        run: python3 programming-learner/tools/test_numerical.py
      # Informational: print coverage + threshold warnings. Drill validation still
      # fails this step (answer not in options / duplicate options). Threshold
      # misses via --min-* only warn; do not fail CI on them yet (P0.2).
      - name: Languages coverage report (informational)
        run: |
          set +e
          python3 languages/coverage.py \
            --min-grammar-lessons 6 --min-grammar-drills 30 \
            --min-vocab-decks 9 --min-vocab-words 110 \
            --min-reference 10
          status=$?
          set -e
          # 0 = clean; 1 = drill validation failures (fail the job);
          # threshold warnings alone still exit 0.
          if [ "$status" -eq 1 ]; then
            echo "coverage.py reported drill validation failures"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "coverage.py failed unexpectedly with status $status"
            exit "$status"
          fi
          echo "Coverage report finished (threshold warnings are informational)."
