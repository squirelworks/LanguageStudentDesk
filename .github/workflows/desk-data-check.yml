name: Desk data checks

# Registry generation, JS syntax, and programming pack integrity for the Desk
# languages/ layer and learner tools. See CURSOR-HANDOFF P0.1.

on:
  push:
    branches: [main]
    paths:
      - "languages/**"
      - "character-learner/**"
      - "grammar-learner/**"
      - "vocabulary-learner/**"
      - "reference-learner/**"
      - "resource-learner/**"
      - "translation-learner/**"
      - "language-learner/**"
      - "programming-learner/**"
      - ".github/workflows/desk-data-check.yml"
  pull_request:
    paths:
      - "languages/**"
      - "character-learner/**"
      - "grammar-learner/**"
      - "vocabulary-learner/**"
      - "reference-learner/**"
      - "resource-learner/**"
      - "translation-learner/**"
      - "language-learner/**"
      - "programming-learner/**"
      - ".github/workflows/desk-data-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registry is committed and complete
        run: |
          python3 languages/build_registry.py
          git diff --exit-code languages/registry.js languages/reference.js
      - name: Desk and learner scripts parse
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find languages -name '*.js' -print0 | sort -z)
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find \
            character-learner \
            grammar-learner \
            vocabulary-learner \
            reference-learner \
            resource-learner \
            translation-learner \
            language-learner \
            programming-learner \
            -name '*.js' -print0 | sort -z)
      - name: Programming packs check out
        run: python3 programming-learner/tools/check_packs.py
