name: Gradle deps cache

# Downloads Gradle, the Android Gradle plugin and the native apps' libraries
# once and saves them as one cache. A build that restores this key only reads
# it, so several apps don't each download the same files. It saves nothing
# new when the cache is current. The release and Play workflows run this
# first, before their app builds.
on:
  push:
    branches: [main]
    paths:
      - "native/**/gradle-wrapper.properties"
      - "native/**/*.gradle.kts"
      - "native/**/*.toml"
      - "native/gradle.properties"
      - ".github/workflows/gradle-deps-cache.yml"
  # GitHub drops a cache nobody has read for a week; this puts it back.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to fill the cache for (default: the run's commit)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # The cache key covers only what decides the downloads: the Gradle
      # wrapper, plugin and library versions and repositories in the Gradle
      # files, minus versionCode/versionName, so a release's version bump
      # keeps the cache. This step is the same in every workflow that uses it.
      - name: Gradle cache key
        id: gradle-key
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          FP=$(git ls-files ':(glob)native/**/gradle-wrapper.properties' ':(glob)native/**/*.gradle.kts' ':(glob)native/**/*.toml' ':(glob)native/gradle.properties' \
            | LC_ALL=C sort | while read -r F; do echo "== $F"; grep -vE '^[[:space:]]*version(Code|Name)([[:space:]=(]|$)' "$F" || true; done \
            | sha256sum | cut -c1-40)
          echo "key=gradle-deps-v2-$RUNNER_OS-$FP" | tee -a "$GITHUB_OUTPUT"
      # The key and paths must match the "Restore Gradle cache" step in the
      # build workflows exactly.
      - name: Is the cache already current?
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-key.outputs.key }}
          lookup-only: true
      # Start from the newest older cache so only what changed is downloaded.
      - name: Restore the previous cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-key.outputs.key }}
          restore-keys: |
            gradle-deps-v2-${{ runner.os }}-
            gradle-deps-v1-${{ runner.os }}-
      - uses: actions/setup-java@v4
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      # One native debug build fetches Gradle, the Android Gradle plugin and
      # the libraries the apps share, including what Gradle only downloads
      # while building (aapt2). The apps are one project, so this covers them.
      - name: Download the native build tooling
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          RETRY="-Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000"
          cd native
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon $RETRY :android:kana:assembleDebug
          rm -f ~/.gradle/caches/modules-2/*.lock ~/.gradle/caches/modules-2/gc.properties
      - name: Save the cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-key.outputs.key }}
