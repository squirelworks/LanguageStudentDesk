name: Native desktop builds

# Linux, Windows and macOS packages of the native apps, attached to a published
# release, plus the native dictionary APKs. After they are attached, the
# checksums job rewrites SHA256SUMS.txt over every asset on the release. An
# AAB is never included. PR and push builds do not run this and do not upload
# packages.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the builds to"
        required: true

permissions:
  contents: write

concurrency:
  group: native-desktop-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Changed apps bumped their version
        shell: bash
        run: |
          git fetch origin --tags --force
          python3 native/tools/check_native_versions.py --release
      - name: Package
        working-directory: native
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ]; then echo "sdk.dir=$ANDROID_HOME" > local.properties; fi
          chmod +x gradlew
          ./gradlew --no-daemon :desktop:japanese-dictionary:packageDistributionForCurrentOS :desktop:multilingual-dictionary:packageDistributionForCurrentOS :desktop:kana:packageDistributionForCurrentOS :desktop:bopomofo:packageDistributionForCurrentOS :desktop:alphabets:packageDistributionForCurrentOS
      - name: Release APKs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
          cd native
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon \
            :android:japanese-dictionary:assembleRelease \
            :android:multilingual-dictionary:assembleRelease
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          shopt -s globstar nullglob
          files=(native/desktop/*/build/compose/binaries/main/**/* native/android/*/build/outputs/apk/release/*.apk)
          files=("${files[@]}" )
          upload=()
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then continue; fi
            case "$(basename "$f")" in
              SquirrelGoKana-*.apk|SquirrelGoBopomofo-*.apk)
                # The release workflow is the only uploader for these APKs.
                ;;
              *) upload+=("$f") ;;
            esac
          done
          test "${#upload[@]}" -gt 0
          gh release upload "$TAG" "${upload[@]}" --clobber

  # The draft wrote SHA256SUMS.txt before these files existed. Rewrite it
  # once every package job has uploaded. Queued with the Desk desktop
  # rewrite so the later one covers both.
  checksums:
    needs: package
    if: always() && needs.package.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/release-checksums.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
    secrets: inherit
