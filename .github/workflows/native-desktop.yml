name: Native desktop builds

# Linux, Windows and macOS packages of the native apps, attached to a published
# release. PR and push builds do not run this and do not upload packages.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the builds to"
        required: true

permissions:
  contents: write

concurrency:
  group: native-desktop-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Package
        working-directory: native
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ]; then echo "sdk.dir=$ANDROID_HOME" > local.properties; fi
          chmod +x gradlew
          ./gradlew --no-daemon :desktop:japanese-dictionary:packageDistributionForCurrentOS :desktop:multilingual-dictionary:packageDistributionForCurrentOS :desktop:kana:packageDistributionForCurrentOS
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          shopt -s globstar nullglob
          files=(native/desktop/*/build/compose/binaries/main/**/*)
          files=("${files[@]}" )
          upload=()
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then upload+=("$f"); fi
          done
          test "${#upload[@]}" -gt 0
          gh release upload "$TAG" "${upload[@]}" --clobber
