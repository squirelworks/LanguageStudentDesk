name: Native core

# Compiles the shared Kotlin core and runs its tests. Uploads nothing.
on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-core.yml"
      # The native catalogs read these at build time. A pull request that
      # only changes them must still compile the apps.
      - "SquirrelGo-Apps/squirrelgo-characters/squirrelgo-kana/www/**"
      - "SquirrelGo-Apps/squirrelgo-characters/squirrelgo-bopomofo/www/**"
      - "SquirrelGo-Apps/squirrelgo-characters/squirrelgo-alphabets/www/**"
      - "SquirrelGo-Apps/squirrelgo-characters/squirrelgo-kanji/www/**"
      - "SquirrelGo-Apps/squirrelgo-characters/squirrelgo-klingon/www/**"
      - "SquirrelGo-Apps/squirrelgo-orthodox-bible/www/**"
      - "SquirrelGo-Apps/squirrelgo-phrasebook/www/**"
      - "SquirrelGo-Apps/shared/suite.js"
      - "languages/features.js"
      - "languages/registry.js"
      - "programming-learner/data/catalog.js"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-core.yml"
      - "SquirrelGo-Apps/squirrelgo-characters/squirrelgo-kana/www/**"
      - "SquirrelGo-Apps/squirrelgo-characters/squirrelgo-bopomofo/www/**"
      - "SquirrelGo-Apps/squirrelgo-characters/squirrelgo-alphabets/www/**"
      - "SquirrelGo-Apps/squirrelgo-characters/squirrelgo-kanji/www/**"
      - "SquirrelGo-Apps/squirrelgo-characters/squirrelgo-klingon/www/**"
      - "SquirrelGo-Apps/squirrelgo-orthodox-bible/www/**"
      - "SquirrelGo-Apps/squirrelgo-phrasebook/www/**"
      - "SquirrelGo-Apps/shared/suite.js"
      - "languages/features.js"
      - "languages/registry.js"
      - "programming-learner/data/catalog.js"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Versions moved forward
        run: |
          git fetch origin --tags --force
          python3 native/tools/check_native_versions.py
      - name: Test
        working-directory: native
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :core:jvmTest :ui:kana:jvmTest :ui:kanji:jvmTest :ui:klingon:jvmTest :ui:phrasebook:jvmTest :ui:orthodox-bible:jvmTest :ui:desk:jvmTest :learner:jvmTest :android:kana:assembleDebug :android:bopomofo:assembleDebug :android:alphabets:assembleDebug :android:kanji:assembleDebug :android:klingon:assembleDebug :android:phrasebook:assembleDebug :android:orthodox-bible:assembleDebug :android:lsd:assembleDebug :desktop:kana:compileKotlin :desktop:bopomofo:compileKotlin :desktop:alphabets:compileKotlin :desktop:kanji:compileKotlin :desktop:klingon:compileKotlin :desktop:phrasebook:compileKotlin :desktop:orthodox-bible:compileKotlin :desktop:lsd:checkDeskPages
      - name: Native release APKs stay on the debug key
        working-directory: native
        run: bash tools/check_native_release_signatures.sh
