name: Native core

# Compiles the shared Kotlin core and runs its tests. Uploads nothing.
on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-core.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-core.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Versions moved forward
        run: |
          git fetch origin --tags --force
          python3 native/tools/check_native_versions.py
      - name: Test
        working-directory: native
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :core:jvmTest :ui:kana:jvmTest :android:kana:assembleDebug :android:bopomofo:assembleDebug :desktop:kana:compileKotlin :desktop:bopomofo:compileKotlin
