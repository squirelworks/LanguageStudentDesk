name: Desk desktop builds

# Standalone Linux, Windows and macOS builds of the Desk (LanguageStudentDesk.py
# with Python, Tk and every web app inside), attached to a tagged release.
# The SquirrelGo release (draft) workflow calls it to attach the builds to
# the draft as each one finishes. When a release is published, it builds only
# what isn't attached yet and then rewrites SHA256SUMS.txt over every asset
# on the release. An AAB is never included. The rolling SquirrelGo *-latest
# pre-releases are skipped. Run it by hand to (re)build and attach for a
# release that already exists.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the builds to, e.g. v0.0.3"
        required: true
      rewrite_checksums:
        description: "Rewrite SHA256SUMS.txt after attaching. Defaults to true. A missing boolean compares equal to false, so a hand run must declare this input."
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      tag:
        description: "Release (or draft) to attach the builds to"
        type: string
        required: true
      ref:
        description: "Commit to build (default: the tag)"
        type: string
        required: false
        default: ""
      rewrite_checksums:
        description: "Rewrite SHA256SUMS.txt after these builds attach. The draft release sets this false; its finish job writes the sums once every asset is on the draft."
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: desk-desktop-builds-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the Linux build working on older glibc.
          - os: ubuntu-22.04
            target: linux
            archive: LanguageStudentDesk-linux.tar.gz
          - os: windows-latest
            target: windows
            archive: LanguageStudentDesk-windows.zip
          - os: macos-latest
            target: macos
            archive: LanguageStudentDesk-macos.zip
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # A build the release draft already attached isn't made again.
      - name: Already attached?
        id: have
        if: github.event_name == 'release'
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qxF "${{ matrix.archive }}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "${{ matrix.archive }} is already on $TAG"
          fi
      # The release's own files, and this commit's build script, which an
      # older tag may not have.
      - uses: actions/checkout@v4
        if: steps.have.outputs.skip != 'true'
        with:
          ref: ${{ inputs.ref || env.TAG }}
      - uses: actions/checkout@v4
        if: steps.have.outputs.skip != 'true'
        with:
          path: .desk-build
          sparse-checkout: .github/scripts

      - uses: actions/setup-python@v5
        if: steps.have.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        if: steps.have.outputs.skip != 'true'
        run: python -m pip install pyinstaller

      # The Japanese dictionary's word list is generated, not committed (see the
      # dictionary's README), so fetch it or the dictionary opens empty.
      - name: Fetch the dictionary data
        if: steps.have.outputs.skip != 'true'
        shell: bash
        working-directory: SquirrelGo-Apps/squirrelgo-dictionary
        run: |
          # Windows has python but not python3, which the script calls.
          if ! command -v python3 >/dev/null; then
            mkdir -p "$RUNNER_TEMP/py3"
            printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/py3/python3"
            chmod +x "$RUNNER_TEMP/py3/python3"
            export PATH="$RUNNER_TEMP/py3:$PATH"
          fi
          tools/fetch_data.sh

      - name: Build
        if: steps.have.outputs.skip != 'true'
        run: python .desk-build/.github/scripts/build_desk.py ${{ matrix.target }} .

      # The Windows build has no console, so only Linux and macOS are run here.
      - name: Smoke test
        if: steps.have.outputs.skip != 'true' && matrix.target != 'windows'
        shell: bash
        run: |
          ./build/desk/dist/LanguageStudentDesk/LanguageStudentDesk --list | tee tools.txt
          test "$(wc -l < tools.txt)" -ge 16
          find build/desk/dist/LanguageStudentDesk -path '*squirrelgo-dictionary/www/data/meta.js' | grep -q .

      - name: Attach to the release
        if: steps.have.outputs.skip != 'true'
        shell: bash
        run: gh release upload "$TAG" "dist/${{ matrix.archive }}" --clobber --repo "$GITHUB_REPOSITORY"

  # GitHub treats a missing boolean as equal to false, so `!= false` skips
  # a publish and a hand run, where this input is not set. A release event
  # always rewrites. A hand run rewrites because workflow_dispatch defaults
  # the input to true. The draft caller passes false, and its workflow name
  # is a second gate, so it does not rewrite while other jobs are uploading.
  checksums:
    needs: build
    if: needs.build.result == 'success' && (github.event_name == 'release' || inputs.rewrite_checksums) && github.workflow != 'SquirrelGo release (draft)'
    permissions:
      contents: write
    uses: ./.github/workflows/release-checksums.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
    secrets: inherit
