name: SquirrelGo Play closed testing

# After the owner publishes a release, builds each app's AAB from that tag and
# sends it straight to its Google Play closed testing track. The AAB never
# leaves the runner: no artifact, no release asset, no commit (RELEASES.md).
# Needs the PLAY_SERVICE_ACCOUNT_JSON secret, and the UPLOAD_* secrets unless
# the apps' Play upload key is the committed debug key. See docs/PLAY.md.
# Store listings are pushed by squirrelgo-listing.yml, not by this workflow.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to send, e.g. squirrelgo-v0.1.0"
        required: true
      apps:
        description: "Apps to send, comma-separated (blank = all), e.g. kana,kanji"
        required: false
      track:
        description: "Play track ('alpha' is the default closed testing track)"
        required: false
        default: alpha
      status:
        description: "completed rolls out to testers; draft for an app never published"
        required: false
        default: completed
        type: choice
        options: [completed, draft]
      check_only:
        description: "Only check the secrets: unlock the upload key and open (then discard) a Play edit for each app. Builds and uploads nothing."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: squirrelgo-play-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' && inputs.check_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The upload key opens with its passwords
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PW: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::UPLOAD_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          trap 'rm -f "$RUNNER_TEMP/upload.keystore" "$RUNNER_TEMP/probe.jar"' EXIT
          keytool -list -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$STORE_PW" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::the store password or alias is wrong"; exit 1; }
          # Signing a throwaway file proves the key password too.
          echo probe > "$RUNNER_TEMP/probe.txt" && (cd "$RUNNER_TEMP" && jar cf probe.jar probe.txt)
          jarsigner -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$STORE_PW" -keypass "$KEY_PW" \
            "$RUNNER_TEMP/probe.jar" "$KEY_ALIAS" > /dev/null \
            || { echo "::error::the key password is wrong"; exit 1; }
          keytool -list -v -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$STORE_PW" -alias "$KEY_ALIAS" \
            | grep -E "Owner:|SHA256:" | head -2
          echo "upload key: OK"
      - name: Play can be reached for every app
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m pip install -q google-api-python-client google-auth
          python .github/scripts/play_upload.py --check \
            com.squirelworks.lsd com.squirelworks.programmingstudentdesk \
            com.squirelworks.mathseducationtraininghelper \
            com.squirelworks.electronicsstudentdesk \
            com.squirelworks.squirrelgoalphabets com.squirelworks.squirrelgobopomofo \
            com.squirelworks.squirrelgokana com.squirelworks.squirrelgokanji \
            com.squirelworks.squirrelgoklingon com.squirelworks.squirrelgodictionary \
            com.squirelworks.squirrelgoorthodoxbible com.squirelworks.squirrelgophrasebook

  # Fills the shared Gradle cache once, so the app builds below read it
  # instead of all downloading the same tooling from Maven Central at once.
  deps:
    if: (github.event_name == 'workflow_dispatch' && !inputs.check_only) || (github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft)
    uses: ./.github/workflows/gradle-deps-cache.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}


  # Native Kana. The bundle goes to Play and is deleted on the runner.
  # It is not a GitHub artifact and not a release asset.
  kana:
    if: (github.event_name == 'workflow_dispatch' && !inputs.check_only) || (github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft)
    needs: deps
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Is Kana selected?
        id: pick
        env:
          APPS: ${{ inputs.apps }}
        run: |
          if [ -z "$APPS" ] || echo ",$APPS," | tr -d ' ' | grep -q ",kana,"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Play access is set up
        if: steps.pick.outputs.go == 'true'
        env:
          HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          [ "$HAS_PLAY" = true ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is missing; see docs/PLAY.md"; exit 1; }
      - uses: actions/checkout@v4
        if: steps.pick.outputs.go == 'true'
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
      - uses: actions/setup-java@v4
        if: steps.pick.outputs.go == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        if: steps.pick.outputs.go == 'true'
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Upload key
        if: steps.pick.outputs.go == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PW: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            {
              echo "UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore"
              echo "UPLOAD_STORE_PASSWORD=$STORE_PW"
              echo "UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "UPLOAD_KEY_PASSWORD=$KEY_PW"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::no upload key in secrets; Play refuses debug-signed bundles (see docs/PLAY.md)"
          fi
      - name: Build the native Kana bundle
        if: steps.pick.outputs.go == 'true'
        run: |
          cd native
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :android:kana:bundlePlay
          VN=$(grep -m1 '^versionName=' versions/kana.properties | cut -d= -f2-)
          AAB=$(echo "$PWD"/android/kana/build/outputs/bundle/play/*.aab)
          test -f "$AAB"
          echo "RELEASE_NAME=SquirrelGo Kana $VN" >> "$GITHUB_ENV"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
      - name: Release notes
        if: steps.pick.outputs.go == 'true'
        run: |
          if [ -f "release-notes/$TAG.md" ]; then
            sed -E -e '/^\|/d' -e 's/^#+ *//' -e 's/\[([^]]*)\]\([^)]*\)/\1/g' -e 's/[*`]//g' "release-notes/$TAG.md" \
              | grep -v '^\s*$' | head -c 500 > "$RUNNER_TEMP/notes.txt"
          else
            echo "SquirrelGo $TAG" > "$RUNNER_TEMP/notes.txt"
          fi
      - uses: actions/setup-python@v5
        if: steps.pick.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Send to Google Play
        if: steps.pick.outputs.go == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m pip install -q google-api-python-client google-auth
          python .github/scripts/play_upload.py --package com.squirelworks.squirrelgokana --aab "$AAB" \
            --track "${{ inputs.track || vars.PLAY_TRACK || 'alpha' }}" \
            --status "${{ inputs.status || 'completed' }}" \
            --name "$RELEASE_NAME" --notes-file "$RUNNER_TEMP/notes.txt"
      - name: Remove the key and the bundle
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore" "$AAB"

  # Native Bopomofo. Same closed-testing path as Kana. The bundle is deleted
