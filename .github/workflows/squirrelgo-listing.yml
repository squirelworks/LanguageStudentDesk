name: SquirrelGo Play store listing

# Pushes each app's android/app/src/main/play/ pack (title, descriptions,
# icon, feature graphic, phone screenshots) to Google Play. Reuses
# squirrelator_play.py listing — same service account as AAB upload, and needs
# Manage store presence on each app. See docs/PLAY.md.
# Runs only by hand: a listing goes to Play once, so neither a push to main
# nor a release sends it again.
on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to update, comma-separated (blank = matrix defaults), e.g. math-desk,electronics-desk"
        required: false

permissions:
  contents: read

concurrency:
  group: squirrelgo-listing
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: math-desk,        package: com.squirelworks.mathseducationtraininghelper, play: archive/webview/math/app/src/main/play }
          - { app: electronics-desk, package: com.squirelworks.electronicsstudentdesk,       play: archive/webview/electronics/app/src/main/play }
    steps:
      - name: Is this app selected?
        id: pick
        env:
          APPS: ${{ inputs.apps }}
        run: |
          if [ -z "$APPS" ] || echo ",$APPS," | tr -d ' ' | grep -q ",${{ matrix.app }},"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "skipped: not in '$APPS'"
          fi
      - name: Play access is set up
        if: steps.pick.outputs.go == 'true'
        env:
          HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          [ "$HAS_PLAY" = true ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is missing; see docs/PLAY.md"; exit 1; }
      - uses: actions/checkout@v4
        if: steps.pick.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.pick.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Push store listing to Google Play
        if: steps.pick.outputs.go == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PKG: ${{ matrix.package }}
          PLAY: ${{ matrix.play }}
        run: |
          [ -d "$PLAY" ] || { echo "::error::$PLAY is missing"; exit 1; }
          python -m pip install -q google-api-python-client google-auth
          python .github/scripts/squirrelator_play.py listing --package "$PKG" --dir "$PLAY"
