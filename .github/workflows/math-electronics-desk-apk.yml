name: Math/Electronics Student Desk APK

# Compile only: proves both phone twins still build on every PR and push
# to main, but uploads nothing. Release APKs come from squirrelgo-release.
on:
  push:
    branches: [main]
    paths:
      - "SquirrelGo-Apps/math-student-desk/**"
      - "SquirrelGo-Apps/electronics-student-desk/**"
      - "math-learner/**"
      - "electronics-learner/**"
      - "languages/learners.css"
      - "languages/lsd-lang.js"
      - "languages/features.js"
      - "languages/lsd-features.js"
      - "languages/lsd-features.css"
      - ".github/workflows/math-electronics-desk-apk.yml"
  pull_request:
    paths:
      - "SquirrelGo-Apps/math-student-desk/**"
      - "SquirrelGo-Apps/electronics-student-desk/**"
      - "math-learner/**"
      - "electronics-learner/**"
      - "languages/learners.css"
      - "languages/lsd-lang.js"
      - "languages/features.js"
      - "languages/lsd-features.js"
      - "languages/lsd-features.css"
      - ".github/workflows/math-electronics-desk-apk.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: math-desk,        dir: SquirrelGo-Apps/math-student-desk }
          - { app: electronics-desk, dir: SquirrelGo-Apps/electronics-student-desk }
    env:
      DIR: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The cache key covers only what decides the downloads: the Gradle
      # wrapper, plugin and library versions and repositories in the Gradle
      # files, minus versionCode/versionName, so a release's version bump
      # keeps the cache. This step is the same in every workflow that uses it.
      - name: Gradle cache key
        id: gradle-key
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          FP=$(git ls-files ':(glob)SquirrelGo-Apps/**/gradle-wrapper.properties' ':(glob)SquirrelGo-Apps/**/android/*.gradle' ':(glob)SquirrelGo-Apps/**/android/app/build.gradle' ':(glob)SquirrelGo-Apps/tools/*.gradle' \
            | LC_ALL=C sort | while read -r F; do echo "== $F"; grep -vE '^[[:space:]]*version(Code|Name)([[:space:]=(]|$)' "$F" || true; done \
            | sha256sum | cut -c1-40)
          echo "key=gradle-deps-v2-$RUNNER_OS-$FP" | tee -a "$GITHUB_OUTPUT"
      # Gradle and the Android build tools come from one shared cache, filled
      # once by the "Gradle deps cache" workflow; builds only read it.
      - name: Restore Gradle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-key.outputs.key }}
          restore-keys: |
            gradle-deps-v2-${{ runner.os }}-
            gradle-deps-v1-${{ runner.os }}-
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" > /dev/null
      - name: Shared debug keystore
        run: |
          # Same as squirrelgo-release: desk twins don't commit a debug key.
          K="$DIR/android/app/debug.keystore"
          [ -f "$K" ] || cp SquirrelGo-Apps/lsd-suite/android/app/debug.keystore "$K"
      - name: Build debug APK
        run: |
          cd "$DIR/android"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
