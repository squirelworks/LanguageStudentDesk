name: SquirrelGo test APK

# The only way to get an APK outside a release. Started by hand
# (Actions -> SquirrelGo test APK -> Run workflow); the APK is a run artifact
# that expires after 7 days. It never creates a release, a tag or a commit.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to build"
        required: true
        type: choice
        options:
          - dictionary
          - orthodox-bible
          - phrasebook
          - kokugo
          - multilingual
          - kana-native
          - bopomofo-native
          - alphabets-native
          - kanji-native
          - klingon-native
          - phrasebook-native
          - dictionary-native
          - lsd-native
      data_tag:
        description: "Dictionary only: jmdict-simplified release tag (blank = latest)"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The cache key covers only what decides the downloads: the Gradle
      # wrapper, plugin and library versions and repositories in the Gradle
      # files, minus versionCode/versionName, so a release's version bump
      # keeps the cache. This step is the same in every workflow that uses it.
      - name: Gradle cache key
        id: gradle-key
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          FP=$(git ls-files ':(glob)SquirrelGo-Apps/**/gradle-wrapper.properties' ':(glob)SquirrelGo-Apps/**/android/*.gradle' ':(glob)SquirrelGo-Apps/**/android/app/build.gradle' ':(glob)SquirrelGo-Apps/tools/*.gradle' \
            | LC_ALL=C sort | while read -r F; do echo "== $F"; grep -vE '^[[:space:]]*version(Code|Name)([[:space:]=(]|$)' "$F" || true; done \
            | sha256sum | cut -c1-40)
          echo "key=gradle-deps-v2-$RUNNER_OS-$FP" | tee -a "$GITHUB_OUTPUT"
      # Gradle and the Android build tools come from one shared cache, filled
      # once by the "Gradle deps cache" workflow; builds only read it.
      - name: Restore Gradle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-key.outputs.key }}
          restore-keys: |
            gradle-deps-v2-${{ runner.os }}-
            gradle-deps-v1-${{ runner.os }}-
      - name: Pick the app
        run: |
          if [ "$APP" = kokugo ] || [ "$APP" = multilingual ] || [ "$APP" = kana-native ] || [ "$APP" = bopomofo-native ] || [ "$APP" = alphabets-native ] || [ "$APP" = kanji-native ] || [ "$APP" = klingon-native ] || [ "$APP" = phrasebook-native ] || [ "$APP" = dictionary-native ] || [ "$APP" = lsd-native ]; then
            SHA=$(git rev-parse --short HEAD)
            if [ "$APP" = kokugo ]; then
              MODULE=japanese-dictionary
              NAME=SquirrelGoKokugoDictionary
            elif [ "$APP" = multilingual ]; then
              MODULE=multilingual-dictionary
              NAME=SquirrelGoMultilingualDictionary
            elif [ "$APP" = kana-native ]; then
              MODULE=kana
              NAME=SquirrelGoKana
            elif [ "$APP" = bopomofo-native ]; then
              MODULE=bopomofo
              NAME=SquirrelGoBopomofo
            elif [ "$APP" = alphabets-native ]; then
              MODULE=alphabets
              NAME=SquirrelGoAlphabets
            elif [ "$APP" = kanji-native ]; then
              MODULE=kanji
              NAME=SquirrelGoKanji
            elif [ "$APP" = klingon-native ]; then
              MODULE=klingon
              NAME=SquirrelGoKlingon
            elif [ "$APP" = phrasebook-native ]; then
              MODULE=phrasebook
              NAME=SquirrelGoPhrasebook
            elif [ "$APP" = dictionary-native ]; then
              MODULE=dictionary
              NAME=SquirrelGoJapaneseDictionary
            else
              MODULE=lsd
              NAME=LanguageStudentDesk
            fi
            echo "NATIVE=1" >> "$GITHUB_ENV"
            echo "NATIVE_MODULE=$MODULE" >> "$GITHUB_ENV"
            echo "APK_NAME=$NAME-test-$SHA" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$APP" in
            *)                            DIR="SquirrelGo-Apps/squirrelgo-$APP" ;;
          esac
          case "$APP" in
            dictionary)     NAME=SquirrelGoJapaneseDictionary ;;
            orthodox-bible) NAME=SquirrelGoOrthodoxBible ;;
            phrasebook)     NAME=SquirrelGoPhrasebook ;;
          esac
          test -d "$DIR/android" || { echo "No Android project at $DIR/android" >&2; exit 1; }
          SHA=$(git rev-parse --short HEAD)
          echo "DIR=$DIR" >> "$GITHUB_ENV"
          echo "APK_NAME=$NAME-test-$SHA" >> "$GITHUB_ENV"
      # Same preparation as the app's compile-only workflow.
      - name: Check audio coverage
        if: inputs.app == 'phrasebook'
        run: cd "$DIR" && python3 tools/phrasebook_audio.py --check
      - name: Download dictionary data (JMdict, KANJIDIC2, RADKFILE, KRADFILE)
        if: inputs.app == 'dictionary'
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_TAG: ${{ inputs.data_tag }}
        run: cd "$DIR" && tools/fetch_data.sh $DATA_TAG
      - name: Sync web assets into the APK
        if: inputs.app == 'phrasebook'
        run: |
          rm -rf "$DIR/android/app/src/main/assets/www"
          mkdir -p "$DIR/android/app/src/main/assets"
          cp -a "$DIR/www" "$DIR/android/app/src/main/assets/www"
      # The runner image ships the Android SDK; just make sure API 36 is there.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "build-tools;35.0.0" "build-tools;36.0.0" > /dev/null
      - name: Download dictionary data for the native dictionary
        if: inputs.app == 'dictionary-native'
        env:
          DATA_TAG: ${{ inputs.data_tag }}
        run: SquirrelGo-Apps/squirrelgo-dictionary/tools/fetch_data.sh ${DATA_TAG}
      - name: Build native test APK
        if: env.NATIVE == '1'
        run: |
          cd native
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          mkdir -p "$RUNNER_TEMP/apk"
          ./gradlew --no-daemon ":android:${NATIVE_MODULE}:assembleRelease"
          cp "android/${NATIVE_MODULE}/build/outputs/apk/release/"*.apk "$RUNNER_TEMP/apk/$APK_NAME.apk"
      - name: Build test APK
        if: env.NATIVE != '1'
        run: |
          cd "$DIR/android"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          mkdir -p "$RUNNER_TEMP/apk"
          if [ "$APP" = dictionary ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/$APK_NAME.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/$APK_NAME.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ runner.temp }}/apk/${{ env.APK_NAME }}.apk
          retention-days: 7
          if-no-files-found: error
