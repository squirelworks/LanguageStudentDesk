name: SquirrelGo test APK

# The only way to get an APK outside a release. Started by hand
# (Actions -> SquirrelGo test APK -> Run workflow); the APK is a run artifact
# that expires after 7 days. It never creates a release, a tag or a commit.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to build"
        required: true
        type: choice
        options:
          - alphabets
          - dictionary
          - kana
          - kanji
          - klingon
          - orthodox-bible
          - phrasebook
      data_tag:
        description: "Dictionary only: jmdict-simplified release tag (blank = latest)"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Pick the app
        run: |
          case "$APP" in
            alphabets|kana|kanji|klingon) DIR="SquirrelGo-Apps/squirrelgo-characters/squirrelgo-$APP" ;;
            *)                            DIR="SquirrelGo-Apps/squirrelgo-$APP" ;;
          esac
          case "$APP" in
            alphabets)      NAME=SquirrelGoAlphabets ;;
            dictionary)     NAME=SquirrelGoDictionary ;;
            kana)           NAME=SquirrelGoKana ;;
            kanji)          NAME=SquirrelGoKanji ;;
            klingon)        NAME=SquirrelGoKlingon ;;
            orthodox-bible) NAME=SquirrelGoOrthodoxBible ;;
            phrasebook)     NAME=SquirrelGoPhrasebook ;;
          esac
          test -d "$DIR/android" || { echo "No Android project at $DIR/android" >&2; exit 1; }
          SHA=$(git rev-parse --short HEAD)
          echo "DIR=$DIR" >> "$GITHUB_ENV"
          echo "APK_NAME=$NAME-test-$SHA" >> "$GITHUB_ENV"
      # Same preparation as the app's compile-only workflow.
      - name: Check audio coverage
        if: inputs.app == 'phrasebook'
        run: cd "$DIR" && python3 tools/phrasebook_audio.py --check
      - name: Download dictionary data (JMdict, KANJIDIC2, RADKFILE, KRADFILE)
        if: inputs.app == 'dictionary'
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_TAG: ${{ inputs.data_tag }}
        run: cd "$DIR" && tools/fetch_data.sh $DATA_TAG
      - name: Sync web assets into the APK
        if: inputs.app == 'kanji' || inputs.app == 'phrasebook'
        run: |
          rm -rf "$DIR/android/app/src/main/assets/www"
          mkdir -p "$DIR/android/app/src/main/assets"
          cp -a "$DIR/www" "$DIR/android/app/src/main/assets/www"
      # The runner image ships the Android SDK; just make sure API 36 is there.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" > /dev/null
      - name: Build test APK
        run: |
          cd "$DIR/android"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          mkdir -p "$RUNNER_TEMP/apk"
          if [ "$APP" = dictionary ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/$APK_NAME.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/$APK_NAME.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ runner.temp }}/apk/${{ env.APK_NAME }}.apk
          retention-days: 7
          if-no-files-found: error
