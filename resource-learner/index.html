<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Learner — Language Student Desk</title>
<link rel="stylesheet" href="../languages/learners.css">
<style>
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 1.2rem; align-items: start; }
  .layout > * { min-width: 0; }
  .side { position: sticky; top: 1rem; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0.5rem; }
  .side button { display: flex; width: 100%; text-align: left; gap: 0.5rem; align-items: baseline; background: none; border: 1px solid transparent; margin-bottom: 2px; padding: 0.45rem 0.6rem; }
  .side button:hover { background: #22222a; border-color: transparent; }
  .side button.active { background: var(--accent); }
  .side .nm { flex: 1; }
  .side .nat { color: var(--muted); font-size: 0.8rem; }
  .side button.active .nat { color: #e8eaf6; }
  .side hr { border: none; border-top: 1px solid var(--line); margin: 0.4rem 0; }
  .list h2 { margin-bottom: 0.4rem; }
  .list h2 small { color: var(--muted); font-weight: 400; font-size: 0.9rem; margin-left: 0.4rem; }
  .desk { font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; margin-bottom: 0.4rem; }
  .resource { display: flex; justify-content: space-between; gap: 1rem; padding: 0.7rem 0; border-bottom: 1px solid var(--line); }
  .resource:last-child { border-bottom: none; }
  .resource h3 { margin: 0 0 0.2rem; font-size: 1.05rem; }
  .resource .meta { color: var(--muted); font-size: 0.88rem; }
  .resource .tags { margin-top: 0.3rem; display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .stars { color: var(--gold); white-space: nowrap; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .side button { width: auto; }
    .side hr { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="grow">
    <h1 id="title">Resource Learner</h1>
    <p id="subtitle">Courses, dictionaries and tools worth your time, for every language on the Desk.</p>
  </div>
  <label class="small muted">Language <select id="langSelect"></select></label>
</header>
<main>
  <div class="layout">
    <nav class="side" id="side"></nav>
    <div id="lists"></div>
  </div>
</main>
<footer class="foot">Part of Language Student Desk. Quick facts and grammar notes are in the <a id="refLink" href="../reference-learner/index.html">Reference Learner</a>.</footer>

<script src="../languages/registry.js"></script>
<script src="../languages/lsd-lang.js"></script>
<script src="resources.js"></script>
<script src="app.js"></script>
</body>
</html>
