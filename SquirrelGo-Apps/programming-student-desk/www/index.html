<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0f12">
<title>Programming Student Desk</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    max-width: 720px;
    padding: 1.1rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f0f12;
    color: #e8e8e8;
  }
  header h1 { margin: 0; color: #26a69a; font-size: 1.55rem; letter-spacing: -0.02em; }
  header p { margin: 0.35rem 0 0; color: #aaa; line-height: 1.4; }
  .note { margin: 0.8rem 0 0; color: #ffcc80; font-size: 0.9rem; }
  ul { list-style: none; margin: 0.8rem 0 0; padding: 0; }
  a.card {
    display: block;
    margin: 0.55rem 0;
    padding: 0.9rem 1rem;
    background: #1a1a20;
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
    min-height: 44px;
  }
  a.card:active { background: #252530; }
  a.card strong { display: block; color: #80cbc4; font-size: 1.05rem; }
  a.card span { display: block; margin-top: 0.25rem; color: #aaa; font-size: 0.9rem; line-height: 1.35; }
  footer { margin-top: 1.2rem; color: #8e8e93; font-size: 0.8rem; line-height: 1.4; }
</style>
</head>
<body hidden>
<header>
  <h1>Programming Student Desk</h1>
  <p id="lead">Courses from the Programming Learner. Each one opens in this app.</p>
  <p class="note" id="note" hidden></p>
</header>
<ul id="list"></ul>
<footer>Language Student Desk · Programming Student Desk<br>Back returns to this menu. Progress stays on this device.</footer>
<script src="../../../programming-learner/data/catalog.js"></script>
<script>
(function () {
  var LEARNER = "../../../programming-learner/index.html";
  var catalog = (window.PROGRAMMING_CATALOG || []).slice().sort(function (a, b) {
    return String(a.name).localeCompare(String(b.name), "en", { sensitivity: "base" })
      || String(a.id).localeCompare(String(b.id));
  });
  var params = new URLSearchParams(location.search);
  var lang = (params.get("lang") || "").trim().toLowerCase();
  var match = null;
  for (var i = 0; i < catalog.length; i++) {
    if (catalog[i].id === lang) { match = catalog[i]; break; }
  }
  // The Desk launcher opens this page with ?lang=<course id>.
  if (match) {
    location.replace(LEARNER + "?lang=" + encodeURIComponent(match.id) + location.hash);
    return;
  }
  document.body.hidden = false;
  document.getElementById("lead").textContent = catalog.length
    ? catalog.length + " courses from the Programming Learner. Each one opens in this app."
    : "Courses from the Programming Learner. Each one opens in this app.";
  var list = document.getElementById("list");
  function card(href, title, desc) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.className = "card";
    a.href = href;
    var strong = document.createElement("strong");
    strong.textContent = title;
    var span = document.createElement("span");
    span.textContent = desc;
    a.appendChild(strong);
    a.appendChild(span);
    li.appendChild(a);
    list.appendChild(li);
  }
  card(LEARNER, "All courses", "Open the Programming Learner and pick from the same list.");
  catalog.forEach(function (c) {
    card(LEARNER + "?lang=" + encodeURIComponent(c.id), c.name, c.era + " — " + c.blurb);
  });
  if (lang) {
    var note = document.getElementById("note");
    note.hidden = false;
    note.textContent = "No programming course with id “" + lang + "”. Pick one below.";
  }
})();
</script>
</body>
</html>
