plugins {
    id 'com.android.application'
}

def repoRoot = rootProject.projectDir.parentFile.parentFile.parentFile
def packScript = new File(repoRoot, "SquirrelGo-Apps/programming-student-desk/tools/pack_assets.py")
def packedAssets = layout.buildDirectory.dir("generated/deskAssets")

// Mirror the Programming Learner into the asset root before it is merged.
// The menu and the learner then share the same relative paths as in the git repo.
def packDeskAssets = tasks.register("packDeskAssets", Exec) {
    inputs.file(packScript)
    inputs.dir(new File(repoRoot, "programming-learner"))
    inputs.file(new File(repoRoot, "languages/learners.css"))
    inputs.file(new File(repoRoot, "languages/lsd-lang.js"))
    inputs.file(new File(repoRoot, "SquirrelGo-Apps/programming-student-desk/www/index.html"))
    outputs.dir(packedAssets)
    def out = packedAssets.get().asFile
    commandLine "python3", packScript.absolutePath, "--dest", out.absolutePath
}

tasks.configureEach { task ->
    if (task.name == "preBuild" || task.name == "mergeDebugAssets" || task.name == "mergeReleaseAssets") {
        task.dependsOn(packDeskAssets)
    }
}

android {
    namespace 'com.squirelworks.programmingstudentdesk'
    compileSdk 36

    defaultConfig {
        applicationId "com.squirelworks.programmingstudentdesk"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.0.2"
    }

    sourceSets {
        main {
            assets.srcDir packedAssets
        }
    }

    // Debug stays on the app-local debug keystore. Release reads the upload
    // key from the environment or from gitignored local.properties
    // (UPLOAD_STORE_FILE, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS,
    // UPLOAD_KEY_PASSWORD). Those values are not committed.
    def localProps = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
    }
    def signingProp = { String name ->
        System.getenv(name) ?: localProps.getProperty(name)
    }
    def uploadStore = signingProp("UPLOAD_STORE_FILE")

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (uploadStore) {
                storeFile file(uploadStore)
                storePassword signingProp("UPLOAD_STORE_PASSWORD")
                keyAlias signingProp("UPLOAD_KEY_ALIAS")
                keyPassword signingProp("UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
