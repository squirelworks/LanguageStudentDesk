plugins {
    id 'com.android.application'
}

def repoRoot = rootProject.projectDir.parentFile.parentFile.parentFile
def packScript = new File(repoRoot, "SquirrelGo-Apps/lsd-suite/tools/pack_assets.py")
def packedAssets = layout.buildDirectory.dir("generated/deskAssets")

// Mirror the learners into the asset root before they are merged. The menu
// and the learners then share the same relative paths as in the git repo.
def packDeskAssets = tasks.register("packDeskAssets", Exec) {
    inputs.file(packScript)
    [
        "grammar-learner", "vocabulary-learner", "language-learner",
        "programming-learner", "legalese-learner", "translation-learner",
        "reference-learner", "resource-learner", "character-learner",
        "klingon", "languages", "SquirrelGo-Apps/lsd-suite/www",
        "SquirrelGo-Apps/squirrelgo-characters",
        "SquirrelGo-Apps/squirrelgo-phrasebook/www",
        "SquirrelGo-Apps/squirrelgo-dictionary/www",
    ].each { inputs.dir(new File(repoRoot, it)) }
    outputs.dir(packedAssets)
    def out = packedAssets.get().asFile
    commandLine "python3", packScript.absolutePath, "--dest", out.absolutePath
}

tasks.configureEach { task ->
    if (task.name == "preBuild" || task.name == "mergeDebugAssets" || task.name == "mergeReleaseAssets") {
        task.dependsOn(packDeskAssets)
    }
}

android {
    namespace 'com.squirelworks.lsd'
    compileSdk 36

    defaultConfig {
        applicationId "com.squirelworks.lsd"
        minSdk 24
        targetSdk 36
        versionCode 12
        versionName "1.0.11"
    }

    sourceSets {
        main {
            assets.srcDir packedAssets
        }
    }

    // A fixed debug key, so new builds install over old ones and keep your data.
    // Play uploads read UPLOAD_STORE_FILE, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS,
    // and UPLOAD_KEY_PASSWORD from the environment, or upload.storeFile,
    // upload.storePassword, upload.keyAlias, and upload.keyPassword from the
    // gitignored local.properties. Release builds without those stay on the debug key.
    def uploadProps = new Properties()
    def uploadPropsFile = rootProject.file("local.properties")
    if (uploadPropsFile.exists()) {
        uploadPropsFile.withInputStream { uploadProps.load(it) }
    }
    def uploadStoreFile = System.getenv("UPLOAD_STORE_FILE") ?: uploadProps.getProperty("upload.storeFile")
    def uploadStorePassword = System.getenv("UPLOAD_STORE_PASSWORD") ?: uploadProps.getProperty("upload.storePassword")
    def uploadKeyAlias = System.getenv("UPLOAD_KEY_ALIAS") ?: uploadProps.getProperty("upload.keyAlias")
    def uploadKeyPassword = System.getenv("UPLOAD_KEY_PASSWORD") ?: uploadProps.getProperty("upload.keyPassword")

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (uploadStoreFile) {
            release {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig (uploadStoreFile ? signingConfigs.release : signingConfigs.debug)
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
