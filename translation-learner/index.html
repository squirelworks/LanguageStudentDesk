<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translation Learner — Language Student Desk</title>
<style>
  :root {
    --bg: #0f0f12;
    --card: #1a1a20;
    --accent: #7e57c2;
    --text: #e8e8e8;
    --muted: #9e9e9e;
    --sidebar: #141418;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #1a1a2e, #2d1b4e);
    padding: 1.2rem 1.5rem;
    text-align: center;
    border-bottom: 3px solid var(--accent);
  }
  header h1 { margin: 0; font-size: 1.6rem; }
  header p { margin: 0.3rem 0 0; color: var(--muted); font-size: 0.95rem; }
  .layout { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 220px;
    background: var(--sidebar);
    border-right: 1px solid #2a2a32;
    padding: 1rem 0.6rem;
    overflow-y: auto;
  }
  .sidebar h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0.4rem 0.6rem 0.6rem;
  }
  .lang-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 0.5rem 0.8rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.92rem;
  }
  .lang-btn:hover, .lang-btn.active {
    background: #2a2a32;
  }
  .lang-btn.active { color: var(--accent); font-weight: 600; }
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 1.2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .controls {
    display: flex;
    gap: 0.8rem;
    align-items: end;
    flex-wrap: wrap;
  }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.2rem; }
  select, textarea, button { font: inherit; }
  select {
    padding: 0.45rem 0.6rem;
    background: var(--card);
    color: var(--text);
    border: 1px solid #333;
    border-radius: 6px;
    min-width: 140px;
  }
  textarea {
    width: 100%;
    min-height: 140px;
    padding: 0.7rem;
    background: var(--card);
    color: var(--text);
    border: 1px solid #333;
    border-radius: 6px;
    font-family: ui-monospace, monospace;
    resize: vertical;
  }
  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 0.55rem 1.1rem;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.1); }
  .panes {
    display: flex;
    gap: 1rem;
    flex: 1;
    min-height: 280px;
  }
  .pane {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .pane h3 { margin: 0 0 0.4rem; font-size: 0.95rem; color: var(--accent); }
  pre {
    flex: 1;
    background: var(--card);
    padding: 0.8rem;
    border-radius: 6px;
    border: 1px solid #333;
    white-space: pre-wrap;
    overflow: auto;
    margin: 0;
    font-family: ui-monospace, monospace;
    font-size: 0.9rem;
  }
  .examples { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .examples button {
    background: #2a2a32;
    color: var(--text);
    border: none;
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .examples button:hover { background: #3a3a42; }
  footer {
    text-align: center;
    padding: 0.8rem;
    color: var(--muted);
    font-size: 0.8rem;
    border-top: 1px solid #2a2a32;
  }
</style>
</head>
<body>
<header>
  <h1>Translation Learner</h1>
  <p>Practice translating between languages using the squirrelator rules — Desk style</p>
</header>
<div class="layout">
  <aside class="sidebar">
    <h2>Quick pairs</h2>
    <button class="lang-btn" data-from="english" data-to="python">English → Python</button>
    <button class="lang-btn" data-from="english" data-to="quickbasic">English → QuickBASIC</button>
    <button class="lang-btn" data-from="english" data-to="klingon">English → Klingon</button>
    <button class="lang-btn" data-from="english" data-to="latin">English → Latin</button>
    <button class="lang-btn" data-from="python" data-to="english">Python → English</button>
    <button class="lang-btn" data-from="quickbasic" data-to="english">QuickBASIC → English</button>
    <button class="lang-btn" data-from="lolcode" data-to="python">LOLCODE → Python</button>
    <button class="lang-btn" data-from="klingon" data-to="english">Klingon → English</button>
  </aside>
  <main class="content">
    <div class="controls">
      <div>
        <label>From</label>
        <select id="from"></select>
      </div>
      <div>
        <label>To</label>
        <select id="to"></select>
      </div>
      <button class="primary" onclick="doTranslate()">Translate</button>
    </div>

    <div class="panes">
      <div class="pane">
        <h3>Source</h3>
        <textarea id="source">print hello</textarea>
      </div>
      <div class="pane">
        <h3>Result</h3>
        <pre id="result">Click Translate or pick a quick pair.</pre>
      </div>
    </div>

    <div>
      <label>Examples</label>
      <div class="examples">
        <button onclick="load('print hello','english','python')">print hello → Python</button>
        <button onclick="load('count from 1 to 5','english','quickbasic')">loop → QuickBASIC</button>
        <button onclick="load('set count to 10','english','javascript')">assignment → JS</button>
        <button onclick="load('PRINT \"Hi\"','quickbasic','english')">QuickBASIC → English</button>
        <button onclick="load('print hello','english','klingon')">hello → Klingon</button>
        <button onclick="load('print hello','english','latin')">hello → Latin</button>
      </div>
    </div>
  </main>
</div>
<footer>
  LanguageStudentDesk · Translation Learner<br>
  Uses squirrelator-style rule logic · standalone in the browser
</footer>

<script>
const LANGS = [
  "english","pseudocode","python","javascript","quickbasic",
  "brainfood","lolcode","z80","shell","sql","latin","klingon"
];

const fromSel = document.getElementById("from");
const toSel = document.getElementById("to");
LANGS.forEach(l => {
  fromSel.add(new Option(l, l));
  toSel.add(new Option(l, l));
});
fromSel.value = "english";
toSel.value = "python";

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    fromSel.value = btn.dataset.from;
    toSel.value = btn.dataset.to;
    doTranslate();
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  });
});

function load(src, from, to) {
  document.getElementById("source").value = src;
  fromSel.value = from;
  toSel.value = to;
  doTranslate();
}

function doTranslate() {
  const src = document.getElementById("source").value.trim();
  const from = fromSel.value;
  const to = toSel.value;
  document.getElementById("result").textContent = translate(src, from, to);
}

// squirrelator-style rules (client-side)
function translate(text, from, to) {
  from = from.toLowerCase(); to = to.toLowerCase();
  if (!LANGS.includes(from) || !LANGS.includes(to))
    return `Unsupported: ${from} → ${to}`;
  if (from === to) return text;
  if (from === "english" || from === "pseudocode") return fromNatural(text, to);
  if (to === "english") return toEnglish(text, from);
  return codeToCode(text, from, to);
}

function fromNatural(text, to) {
  const t = text.toLowerCase();
  let m = t.match(/(?:print|show|display|output)\s+['"]?(.+?)['"]?$/);
  if (m || t.includes("hello")) {
    const msg = m ? m[1].replace(/[\"']/g,"") : "Hello";
    const map = {
      python: `print("${msg}")`,
      javascript: `console.log("${msg}");`,
      quickbasic: `PRINT "${msg}"`,
      lolcode: `VISIBLE "${msg}"`,
      brainfood: `++++++++++[>+++++++>++++++++++>+++>+<<<<-]>++.>+.+++++++..+++.`,
      z80: `    ; print "${msg}"\n    LD   HL, msg\n    CALL print_string\nmsg: DEFM "${msg}"\n     DEFB 0`,
      shell: `echo "${msg}"`,
      sql: `SELECT '${msg}' AS message;`,
      latin: `# Latin: Salve / ${msg}\nprint("${msg}")  # or: dic "${msg}"`,
      klingon: `# Klingon: ${msg}\n# tlhIngan Hol: jatlh "${msg}"\nprint("${msg}")`,
    };
    return map[to] || `# no mapping for ${to}`;
  }
  m = t.match(/(?:for|loop|count|repeat).*?(?:from\s+)?(\d+)\s+(?:to|through)\s+(\d+)/);
  if (m) {
    const [start, end] = [m[1], m[2]];
    const map = {
      python: `for i in range(${start}, ${+end+1}):\n    print(i)`,
      javascript: `for (let i = ${start}; i <= ${end}; i++) {\n  console.log(i);\n}`,
      quickbasic: `FOR i = ${start} TO ${end}\n  PRINT i\nNEXT i`,
      lolcode: `IM IN YR loop UPPIN YR i TIL BOTH SAEM i AN ${end}\n  VISIBLE i\nIM OUTTA YR loop`,
      shell: `for i in $(seq ${start} ${end}); do echo $i; done`,
      latin: `# Latin loop ${start} to ${end}\nfor i in range(${start}, ${+end+1}):\n    print(i)  # numerus`,
      klingon: `# Klingon loop ${start} to ${end}\n# wej logh\nfor i in range(${start}, ${+end+1}):\n    print(i)`,
    };
    return map[to] || `# no loop mapping for ${to}`;
  }
  m = t.match(/(?:set|let|make)\s+(\w+)\s+(?:to|=)\s+(.+)/);
  if (m) {
    const [v, val] = [m[1], m[2].trim()];
    const map = {
      python: `${v} = ${val}`,
      javascript: `let ${v} = ${val};`,
      quickbasic: `${v} = ${val}`,
      lolcode: `I HAS A ${v} ITZ ${val}`,
      shell: `${v}=${val}`,
      latin: `# Latin: ${v} est ${val}\n${v} = ${val}`,
      klingon: `# Klingon: ${v} ${val} 'oH\n${v} = ${val}`,
    };
    return map[to] || `# no assignment mapping for ${to}`;
  }
  return `# No pattern matched\n# Source: ${text}`;
}

function toEnglish(text, from) {
  const lines = text.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#") && !l.startsWith(";"));
  const out = [];
  for (const s of lines) {
    if (from === "python" && s.startsWith("print(")) out.push("Print " + s.slice(6,-1));
    else if (from === "quickbasic" && s.toUpperCase().startsWith("PRINT")) out.push("Print " + s.slice(5).trim());
    else if (from === "lolcode" && s.includes("VISIBLE")) out.push("Show " + s.split("VISIBLE")[1].trim());
    else if (from === "javascript" && s.includes("console.log")) out.push("Print to console");
    else if (from === "z80" && /LD/i.test(s)) out.push("Load data: " + s);
    else if (from === "z80" && /INC/i.test(s)) out.push("Increment: " + s);
    else if (from === "latin") out.push("Latin: " + s);
    else if (from === "klingon") out.push("Klingon: " + s);
    else out.push("Execute: " + s);
  }
  return out.length ? out.join("\n") : "(no recognizable statements)";
}

function codeToCode(text, from, to) {
  const eng = toEnglish(text, from);
  if (eng.startsWith("(")) return `# Direct mapping not available\n# ${eng}`;
  return fromNatural(eng, to);
}

// Support ?lang= to preselect target
const params = new URLSearchParams(location.search);
const start = params.get("lang");
if (start && LANGS.includes(start)) {
  toSel.value = start;
}
</script>
</body>
</html>
