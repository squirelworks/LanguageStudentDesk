<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reference Learner — Language Student Desk</title>
<link rel="stylesheet" href="../languages/learners.css">
<link rel="stylesheet" href="../languages/klingon/piqad.css">
<style>
  .layout { display: grid; grid-template-columns: 230px 1fr; gap: 1.2rem; align-items: start; }
  .layout > * { min-width: 0; }
  .side { position: sticky; top: 1rem; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0.5rem; max-height: calc(100vh - 2rem); overflow-y: auto; }
  .side button { display: flex; width: 100%; text-align: left; gap: 0.5rem; align-items: baseline; background: none; border: 1px solid transparent; margin-bottom: 2px; padding: 0.45rem 0.6rem; }
  .side button:hover { background: #22222a; border-color: transparent; }
  .side button.active { background: var(--accent); }
  .side .nm { flex: 1; }
  .side .nat { color: var(--muted); font-size: 0.8rem; }
  .side button.active .nat { color: #e8eaf6; }
  .side .count { font-size: 0.75rem; color: var(--muted); }
  .side button.active .count { color: #e8eaf6; }
  .side .sec { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.2rem 0.6rem; }
  .entry .html p, .entry .html ul { margin: 0.35rem 0; }
  .entry .html table { margin: 0.6rem 0; }
  .entry .html td:first-child { white-space: nowrap; }
  .entry .html b { color: var(--gold); }
  .side hr { border: none; border-top: 1px solid var(--line); margin: 0.4rem 0; }
  .search { width: 100%; margin-bottom: 0.7rem; }
  .topics { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 1rem; }
  .topics button { border-radius: 14px; padding: 0.2rem 0.75rem; font-size: 0.85rem; }
  .topics button.active { background: var(--accent); border-color: var(--accent); }
  .intro h2 { margin: 0 0 0.2rem; }
  .intro h2 .nat { color: var(--text); font-weight: 400; margin-left: 0.4rem; }
  .intro h2 .nat.piqad { font-family: "pIqaD", sans-serif; color: var(--gold); }
  .intro .links { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; font-size: 0.9rem; }
  .group-h { color: var(--gold); font-size: 1.1rem; margin: 1.6rem 0 0.6rem; border-bottom: 1px solid var(--line); padding-bottom: 0.3rem; }
  .group-h:first-child { margin-top: 0; }
  .group-h small { color: var(--muted); font-weight: 400; font-size: 0.85rem; margin-left: 0.4rem; }
  .entry h3 { margin: 0 0 0.35rem; font-size: 1.08rem; display: flex; gap: 0.6rem; align-items: baseline; flex-wrap: wrap; }
  .entry h3 a { color: inherit; text-decoration: none; }
  .entry h3 a:hover { text-decoration: underline; }
  .entry h3 .pill { font-weight: 400; }
  .entry p { margin: 0.35rem 0; }
  .entry p mark, .ex .t mark, .tbl td mark { background: none; color: var(--gold); font-weight: 700; }
  .tbl td:first-child mark { font-size: 1.3rem; }
  .entry.flash { border-color: var(--gold); }
  .ex { border-left: 3px solid var(--accent2); background: #17171d; padding: 0.45rem 0.8rem; margin: 0.5rem 0; border-radius: 0 6px 6px 0; display: flex; gap: 0.6rem; align-items: flex-start; }
  .ex .body { flex: 1; min-width: 0; }
  .ex .t { font-size: 1.25rem; }
  .entry.cjk .ex .t, .entry.cjk .tbl td { font-family: var(--cjk); }
  .entry.lang-klingon .tbl td { font-family: Georgia, "DejaVu Serif", "Times New Roman", serif; }
  .ex .pq { font-family: "pIqaD", sans-serif; color: var(--gold); font-size: 1.25rem; }
  .ex .r { color: #90caf9; font-size: 0.9rem; }
  .ex .e { font-size: 0.95rem; }
  .ex .say { padding: 0.15rem 0.5rem; font-size: 0.9rem; }
  .tbl { overflow-x: auto; margin: 0.6rem 0; }
  .tbl td:first-child { white-space: nowrap; }
  .tbl tr:hover td { background: #1e1e26; }
  pre { background: #111116; border: 1px solid var(--line); border-radius: 6px; padding: 0.7rem 0.9rem; overflow-x: auto; font-size: 0.88rem; margin: 0.6rem 0; }
  .tags { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .tags .pill { cursor: pointer; }
  .tags .pill:hover { border-color: var(--accent); color: var(--text); }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; max-height: none; display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .side button { width: auto; }
    .side hr, .side .count, .side .sec { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="grow">
    <h1 id="title">Reference Learner</h1>
    <p id="subtitle">Quick lookup for grammar points, sounds, script notes and phrases.</p>
  </div>
  <label class="small muted" id="piqadOpt" hidden><input type="checkbox" id="piqad"> Show pIqaD</label>
  <label class="small muted">Language <select id="langSelect"></select></label>
</header>
<main>
  <div class="layout">
    <nav class="side" id="side"></nav>
    <div>
      <input class="search" id="search" type="search" placeholder="Search references…" autocomplete="off">
      <div class="topics" id="topics"></div>
      <div id="intro"></div>
      <div id="results"><p class="empty">Loading…</p></div>
    </div>
  </div>
</main>
<footer class="foot">Part of Language Student Desk. Go deeper in the <a id="grammarLink" href="../grammar-learner/index.html">Grammar Learner</a> and the <a id="langLink" href="../language-learner/index.html">Language Learner</a>.</footer>

<script src="../languages/registry.js"></script>
<script src="../languages/lsd-lang.js"></script>
<script src="programming.js"></script>
<script src="sources.js"></script>
<script src="app.js"></script>
</body>
</html>
